name: Release
permissions:
  contents: read
on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "pomerium-ci-bot[bot]"
          git config user.email "346165314+pomerium-ci-bot[bot]@users.noreply.github.com"

      - name: Install helm
        uses: azure/setup-helm@v3
        with:
          version: v3.5.1

      - name: Add bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.4.0
        env:
          CR_TOKEN: "${{ steps.ci-token.outputs.token }}"
        with:
          charts_dir: charts
          charts_repo_url: https://helm.pomerium.io

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup chart-testing
        id: lint
        uses: helm/chart-testing-action@v2.2.1

      - name: Chart linting
        run: |
          ct lint --config .ct-release.yaml
